<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Kiểm thử game maps</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f3ef;color:#1f1e1c;display:grid;place-items:center;min-height:100vh;padding:20px}
form{background:#fff;border:1px solid #e3e1d9;border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
h1{font-size:20px;margin:0 0 4px}p{color:#6b6a65;margin:0 0 20px;font-size:15px}
input{width:100%;font-size:17px;padding:14px;border:1px solid #d6d4cc;border-radius:10px;margin-bottom:14px}
button{width:100%;font-size:17px;padding:14px;border:0;border-radius:10px;background:#1f1e1c;color:#fff;font-weight:600}
.err{color:#b42318;margin:-6px 0 14px}
</style></head><body>
<form method="post" action="/login"><h1>Kiểm thử game maps</h1><p>Nhập mật khẩu quản trị để tiếp tục.</p>
<!--ERR-->
<input type="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required autofocus>
<button type="submit">Đăng nhập</button></form></body></html>
