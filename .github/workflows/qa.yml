name: QA game maps
# Website quản lý (Cloudflare Worker) kích hoạt workflow này: theo lịch hoặc khi bấm "Chạy ngay".

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Số lượt chạy (1-20)"
        default: "20"
      api:
        description: "Địa chỉ website quản lý (website tự điền)"
        default: ""
      selftest:
        description: "Chạy với trang mẫu trong repo"
        default: "false"

concurrency: qa-game-maps

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - id: m
        run: |
          N="${{ inputs.count }}"; N=${N:-20}
          [ "$N" -gt 20 ] && N=20; [ "$N" -lt 1 ] && N=1
          echo "ids=$(seq 0 $((N-1)) | jq -cs .)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5          # mỗi job là 1 máy ảo mới, IP mới
      matrix:
        id: ${{ fromJson(needs.plan.outputs.ids) }}
    env:
      API_URL: ${{ inputs.api }}
      SELFTEST: ${{ inputs.selftest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: runner/requirements.txt }
      - run: pip install -r runner/requirements.txt
      - name: Cài Chrome cho Playwright
        run: python -m playwright install --with-deps chrome || python -m playwright install --with-deps chromium
      - name: Trang mẫu (chỉ khi chạy thử)
        if: inputs.selftest == 'true'
        run: |
          (cd test && python -m http.server 8765 >/dev/null 2>&1 &)
          sleep 1
          echo "SITE_URL=http://localhost:8765/page.html" >> "$GITHUB_ENV"
      - name: Chạy kiểm thử
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export RUNNER_TOKEN=$(printf '%s' "$CF_TOKEN:runner" | sha256sum | cut -c1-48)
          python runner/run.py --config config.yaml --profile ${{ matrix.id }} --out result.json
